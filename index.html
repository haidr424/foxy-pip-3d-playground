<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#a9e5ff">
    <title>Foxy &amp; Pip — 3D Motion Playground</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #23465a;
        background: #d7f2ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(#a8e3ff 0%, #e8faff 68%, #b9e890 100%);
      }

      #scene {
        position: fixed;
        inset: 0;
      }

      #scene canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .record-button {
        min-width: 154px;
        color: #fff;
        background: #347e91;
      }

      .record-button:hover { background: #28697b; }
      .record-button:disabled { opacity: .65; cursor: wait; transform: none; }

      .controls {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: max(20px, env(safe-area-inset-bottom));
        display: flex;
        gap: 10px;
        padding: 10px;
        transform: translateX(-50%);
        border: 1px solid #fff9;
        border-radius: 20px;
        background: #fffffff0;
        box-shadow: 0 12px 35px #24536a26;
        backdrop-filter: blur(12px);
      }

      button {
        min-width: 90px;
        padding: 11px 20px;
        border: 0;
        border-radius: 13px;
        color: #396171;
        background: transparent;
        font: inherit;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        transition: transform .18s ease, background .18s ease, color .18s ease;
      }

      button:hover { transform: translateY(-2px); }
      button[aria-pressed="true"] { color: white; background: #ff9a42; }
      button:focus-visible { outline: 3px solid #3a95bd; outline-offset: 3px; }

      .hint {
        position: absolute;
        right: 16px;
        bottom: 20px;
        color: #47717e;
        font-size: .78rem;
        font-weight: 700;
      }

      .status {
        position: absolute;
        left: 16px;
        bottom: 20px;
        color: #47717e;
        font-size: .78rem;
        font-weight: 700;
      }

      @media (max-width: 600px) {
        .controls { gap: 4px; padding: 7px; max-width: calc(100vw - 20px); }
        button { min-width: 0; padding: 10px 13px; font-size: .9rem; }
        .record-button { min-width: 115px; padding-inline: 10px; font-size: .78rem; }
        .hint { display: none; }
        .status { bottom: 82px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="scene" aria-label="Interactive 3D Foxy and Pip animation"></main>
    <nav class="controls" aria-label="Choose animation">
      <button type="button" data-motion="walk" aria-pressed="false">Walk</button>
      <button type="button" data-motion="dance" aria-pressed="true">Dance</button>
      <button type="button" data-motion="play" aria-pressed="false">Play</button>
      <button type="button" class="record-button" id="record-button">Export 1080p video</button>
    </nav>
    <p class="status" id="status" role="status" aria-live="polite">Loading 3D scene…</p>
    <p class="hint">Drag to look around · Scroll to zoom</p>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const mount = document.querySelector("#scene");
      const status = document.querySelector("#status");
      const buttons = [...document.querySelectorAll("[data-motion]")];
      const recordButton = document.querySelector("#record-button");
      const EXPORT_WIDTH = 1920;
      const EXPORT_HEIGHT = 1080;
      const EXPORT_RENDER_WIDTH = 1280;
      const EXPORT_RENDER_HEIGHT = 720;
      const EXPORT_FPS = 30;
      const EXPORT_DURATION = 12;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#a8e3ff");
      scene.fog = new THREE.Fog("#d8f3ff", 15, 32);

      const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 5.2, 13.8);
      camera.lookAt(0, 2.15, 0);

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      } catch (error) {
        console.error("Could not initialize the 3D scene:", error);
        status.textContent = "WebGL is unavailable. Try enabling hardware acceleration in your browser.";
        recordButton.disabled = true;
        throw error;
      }
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      mount.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight("#b5e5ff", 0.75));

      const keyLight = new THREE.DirectionalLight("#ffdcac", 3.4);
      keyLight.position.set(-5, 10, 7);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -9;
      keyLight.shadow.camera.right = 9;
      keyLight.shadow.camera.top = 8;
      keyLight.shadow.camera.bottom = -6;
      keyLight.shadow.bias = -0.00025;
      keyLight.shadow.radius = 4;
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight("#b4ddff", 1.55);
      rimLight.position.set(4, 6, -6);
      scene.add(rimLight);

      const mat = (color, roughness = 0.62) =>
        new THREE.MeshStandardMaterial({ color, roughness, metalness: 0 });

      const materials = {
        orange: mat("#e66b25"),
        orangeLight: mat("#f48a36"),
        cream: mat("#fff0d4"),
        white: mat("#fffaf0"),
        pink: mat("#f4a0a0"),
        dark: mat("#452d32", 0.35),
        irisBlue: mat("#40bddd", 0.3),
        irisBrown: mat("#9b5832", 0.3),
        yellow: mat("#ffd33f"),
        yellowLight: mat("#ffe47a"),
        gold: mat("#f39a28"),
        hoodie: mat("#ffbd25"),
        hoodieShade: mat("#e99319"),
        green: mat("#83c853"),
        greenDark: mat("#57a54c"),
        flower: mat("#fff2ac"),
      };

      const sphereGeometry = new THREE.SphereGeometry(1, 24, 18);

      function ellipsoid(parent, material, position, scale, geometry = sphereGeometry) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...position);
        mesh.scale.set(...scale);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      function capsule(parent, material, radius, length, position, rotation = [0, 0, 0]) {
        const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 4, 10), material);
        mesh.position.set(...position);
        mesh.rotation.set(...rotation);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      function cone(parent, material, radius, height, position, rotation = [0, 0, 0]) {
        const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 5), material);
        mesh.position.set(...position);
        mesh.rotation.set(...rotation);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      function makeEye(parent, x, y, z, irisMaterial, size = 0.15) {
        ellipsoid(parent, materials.white, [x, y, z], [size * 1.05, size * 1.25, 0.075]);
        ellipsoid(parent, irisMaterial, [x, y - 0.015, z + 0.061], [size * 0.70, size * 0.83, 0.039]);
        ellipsoid(parent, materials.dark, [x, y - 0.008, z + 0.09], [size * 0.43, size * 0.56, 0.026]);
        ellipsoid(parent, materials.white, [x - 0.032, y + 0.048, z + 0.115], [0.031, 0.035, 0.016]);
        ellipsoid(parent, materials.white, [x + 0.032, y - 0.036, z + 0.113], [0.013, 0.015, 0.01]);
      }

      function makeFox() {
        const root = new THREE.Group();
        const rig = new THREE.Group();
        root.add(rig);

        ellipsoid(rig, materials.hoodie, [0, 1.18, 0], [0.62, 0.82, 0.48]);
        ellipsoid(rig, materials.cream, [0, 1.20, 0.426], [0.37, 0.55, 0.055]);
        ellipsoid(rig, materials.hoodieShade, [0, 1.82, -0.02], [0.51, 0.18, 0.43]);

        const tailPivot = new THREE.Group();
        tailPivot.position.set(-0.49, 0.94, -0.18);
        rig.add(tailPivot);
        const tail = ellipsoid(tailPivot, materials.orange, [-0.48, 0.12, -0.12], [0.48, 0.22, 0.26]);
        tail.rotation.z = -0.45;
        const tailTip = ellipsoid(tailPivot, materials.white, [-0.81, 0.23, -0.13], [0.20, 0.19, 0.23]);
        tailTip.rotation.z = -0.45;

        const legs = [];
        for (const side of [-1, 1]) {
          const leg = new THREE.Group();
          leg.position.set(side * 0.27, 0.58, 0.04);
          rig.add(leg);
          capsule(leg, materials.orange, 0.13, 0.34, [0, -0.12, 0]);
          ellipsoid(leg, materials.cream, [0, -0.34, 0.12], [0.17, 0.11, 0.23]);
          legs.push(leg);
        }

        const arms = [];
        for (const side of [-1, 1]) {
          const arm = new THREE.Group();
          arm.position.set(side * 0.52, 1.63, 0.02);
          rig.add(arm);
          capsule(arm, materials.hoodie, 0.14, 0.43, [side * 0.11, -0.28, 0.04], [0, 0, side * -0.28]);
          ellipsoid(arm, materials.cream, [side * 0.13, -0.53, 0.13], [0.16, 0.13, 0.16]);
          arms.push(arm);
        }

        const head = new THREE.Group();
        head.position.set(0, 2.12, 0.04);
        rig.add(head);
        ellipsoid(head, materials.orangeLight, [0, 0.08, 0], [0.70, 0.61, 0.51]);
        for (const side of [-1, 1]) {
          const ear = cone(head, materials.orange, 0.23, 0.63, [side * 0.43, 0.57, -0.01]);
          ear.rotation.z = side * -0.25;
          const inner = cone(head, materials.pink, 0.125, 0.40, [side * 0.43, 0.55, 0.15]);
          inner.rotation.z = side * -0.25;
          makeEye(head, side * 0.25, 0.11, 0.444, materials.irisBlue, 0.17);
          ellipsoid(head, materials.cream, [side * 0.24, -0.23, 0.40], [0.28, 0.19, 0.16]);
          ellipsoid(head, materials.orange, [side * 0.57, -0.04, 0.23], [0.16, 0.09, 0.08]);
        }
        ellipsoid(head, materials.cream, [0, -0.10, 0.48], [0.28, 0.19, 0.12]);
        ellipsoid(head, materials.dark, [0, -0.04, 0.594], [0.075, 0.05, 0.045]);
        ellipsoid(head, materials.dark, [0, -0.32, 0.50], [0.12, 0.085, 0.035]);
        ellipsoid(head, materials.pink, [0, -0.36, 0.535], [0.06, 0.032, 0.02]);
        capsule(head, materials.orange, 0.05, 0.18, [0, 0.60, 0], [0, 0, 0.5]);

        root.userData = { rig, head, tailPivot, legs, arms };
        root.position.x = -1.55;
        return root;
      }

      function makeChick() {
        const root = new THREE.Group();
        const rig = new THREE.Group();
        root.add(rig);
        ellipsoid(rig, materials.yellow, [0, 1.12, 0], [0.55, 0.70, 0.46]);
        ellipsoid(rig, materials.yellowLight, [0, 1.53, 0.02], [0.52, 0.50, 0.45]);

        const wings = [];
        for (const side of [-1, 1]) {
          const wing = new THREE.Group();
          wing.position.set(side * 0.44, 1.24, 0.03);
          rig.add(wing);
          ellipsoid(wing, materials.yellowLight, [side * 0.10, 0, 0], [0.23, 0.34, 0.18]);
          wings.push(wing);
        }

        for (const side of [-1, 1]) {
          const leg = new THREE.Group();
          leg.position.set(side * 0.21, 0.52, 0.02);
          rig.add(leg);
          capsule(leg, materials.gold, 0.055, 0.20, [0, -0.12, 0]);
          ellipsoid(leg, materials.gold, [0, -0.25, 0.08], [0.19, 0.07, 0.20]);
          for (const toe of [-1, 0, 1]) {
            ellipsoid(leg, materials.gold, [toe * 0.085, -0.28, 0.21], [0.085, 0.045, 0.12]);
          }
          root.userData.legs ??= [];
          root.userData.legs.push(leg);
        }

        const head = new THREE.Group();
        head.position.set(0, 1.65, 0.06);
        rig.add(head);
        makeEye(head, -0.19, 0.03, 0.40, materials.irisBrown, 0.14);
        makeEye(head, 0.19, 0.03, 0.40, materials.irisBrown, 0.14);
        const beak = cone(head, materials.gold, 0.15, 0.32, [0, -0.19, 0.51], [Math.PI / 2, 0, 0]);
        beak.rotation.z = Math.PI;
        ellipsoid(head, materials.dark, [0, -0.31, 0.40], [0.10, 0.05, 0.035]);
        ellipsoid(head, materials.pink, [0, -0.38, 0.41], [0.055, 0.04, 0.02]);
        for (const side of [-1, 1]) {
          const feather = cone(head, materials.yellowLight, 0.09, 0.32, [side * 0.09, 0.54, -0.02]);
          feather.rotation.z = side * -0.4;
        }

        root.userData.rig = rig;
        root.userData.head = head;
        root.userData.wings = wings;
        root.position.x = 1.55;
        return root;
      }

      function makeFlower(x, z, scale = 1) {
        const group = new THREE.Group();
        group.position.set(x, 0.07, z);
        group.scale.setScalar(scale);
        scene.add(group);
        const stem = capsule(group, materials.greenDark, 0.025, 0.35, [0, 0.19, 0]);
        stem.rotation.z = -0.12;
        ellipsoid(group, materials.gold, [0, 0.43, 0], [0.085, 0.085, 0.06]);
        for (let i = 0; i < 5; i++) {
          const angle = i * Math.PI * 2 / 5;
          ellipsoid(group, materials.flower,
            [Math.cos(angle) * 0.12, 0.43 + Math.sin(angle) * 0.12, 0],
            [0.09, 0.07, 0.045]);
        }
      }

      function makeTree(x, z, scale = 1) {
        const tree = new THREE.Group();
        tree.position.set(x, 0, z);
        tree.scale.setScalar(scale);
        scene.add(tree);
        capsule(tree, mat("#956a3b"), 0.13, 1.15, [0, 0.60, 0]);
        ellipsoid(tree, materials.greenDark, [0, 1.45, 0], [0.72, 0.85, 0.65]);
        ellipsoid(tree, materials.green, [-0.32, 1.78, 0.05], [0.42, 0.46, 0.39]);
        ellipsoid(tree, mat("#9bd765"), [0.33, 1.70, 0.08], [0.37, 0.43, 0.36]);
      }

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        mat("#9ad86a")
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -0.06;
      ground.receiveShadow = true;
      scene.add(ground);

      for (let i = 0; i < 6; i++) {
        const hill = ellipsoid(scene, i % 2 ? materials.green : materials.greenDark,
          [(i - 2.5) * 4.2, -0.25, -5 - (i % 3) * 1.5],
          [4.1, 1.35 + (i % 2) * 0.4, 1.2]);
        hill.castShadow = false;
      }
      makeTree(-5.4, -2.0, 1.15);
      makeTree(5.2, -2.5, 1.05);
      makeTree(-7.2, -1.0, 0.8);
      makeTree(7.0, -1.6, 0.8);
      for (const [x, z, size] of [
        [-4.3, 0.2, 0.8], [-3.6, -0.4, 0.65], [4.2, -0.1, 0.75],
        [3.7, 0.5, 0.58], [-2.7, -1.0, 0.52], [2.9, -0.8, 0.6],
      ]) makeFlower(x, z, size);

      const sunBall = new THREE.Mesh(
        sphereGeometry,
        new THREE.MeshBasicMaterial({ color: "#ffe875", toneMapped: false })
      );
      sunBall.position.set(5.1, 6.4, -9);
      sunBall.scale.setScalar(0.65);
      scene.add(sunBall);

      function makeCanvasLabel(drawLabel, width = 1024, height = 220) {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Could not create the 3D title texture.");
        drawLabel(context, width, height);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.minFilter = THREE.LinearMipmapLinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = true;
        return { texture, canvas };
      }

      const { texture: logoTexture } = makeCanvasLabel((context, width, height) => {
        context.clearRect(0, 0, width, height);
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = "900 142px Trebuchet MS, Segoe UI, sans-serif";
        context.lineJoin = "round";
        context.lineWidth = 22;
        context.strokeStyle = "#fffdf2";
        context.shadowColor = "#6c987d";
        context.shadowBlur = 17;
        context.shadowOffsetY = 11;
        context.strokeText("Foxy & Pip", width / 2, height / 2);
        context.shadowColor = "transparent";
        context.shadowBlur = 0;
        context.shadowOffsetY = 0;
        const gradient = context.createLinearGradient(0, 30, 0, height - 20);
        gradient.addColorStop(0, "#ffc953");
        gradient.addColorStop(0.52, "#fff5dd");
        gradient.addColorStop(1, "#ff9d42");
        context.fillStyle = gradient;
        context.fillText("Foxy & Pip", width / 2, height / 2);
      });
      const logo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: logoTexture,
        transparent: true,
        depthWrite: false,
        toneMapped: false,
      }));
      logo.position.set(0, 5.1, 0);
      logo.scale.set(6.6, 1.42, 1);
      scene.add(logo);

      function createMotionLabel() {
        const { texture, canvas } = makeCanvasLabel((context, width, height) => {
          context.clearRect(0, 0, width, height);
          context.fillStyle = "rgba(31, 76, 80, 0.88)";
          context.beginPath();
          context.roundRect(16, 20, width - 32, height - 40, 58);
          context.fill();
          context.font = "700 62px Trebuchet MS, Segoe UI, sans-serif";
          context.fillStyle = "#ffffff";
          context.textAlign = "center";
          context.textBaseline = "middle";
          context.fillText("DANCE · FOXY & PIP", width / 2, height / 2);
        }, 720, 140);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthWrite: false,
          toneMapped: false,
        }));
        sprite.position.set(0, 0.68, 2.5);
        sprite.scale.set(3.9, 0.76, 1);
        scene.add(sprite);
        return { sprite, texture, canvas };
      }
      const motionLabel = createMotionLabel();

      const fox = makeFox();
      const pip = makeChick();
      scene.add(fox, pip);

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new BokehPass(scene, camera, {
        focus: 14,
        aperture: 0.000018,
        maxblur: 0.0012,
      }));
      composer.addPass(new UnrealBloomPass(
        new THREE.Vector2(innerWidth, innerHeight),
        0.18,
        0.55,
        0.9,
      ));
      composer.addPass(new OutputPass());

      function updateMotionLabel(value) {
        const context = motionLabel.canvas.getContext("2d");
        if (!context) throw new Error("Could not update the motion label.");
        context.clearRect(0, 0, motionLabel.canvas.width, motionLabel.canvas.height);
        context.fillStyle = "rgba(31, 76, 80, 0.88)";
        context.beginPath();
        context.roundRect(16, 20, motionLabel.canvas.width - 32, motionLabel.canvas.height - 40, 58);
        context.fill();
        context.font = "700 62px Trebuchet MS, Segoe UI, sans-serif";
        context.fillStyle = "#ffffff";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(`${value.toUpperCase()} · FOXY & PIP`, motionLabel.canvas.width / 2, motionLabel.canvas.height / 2);
        motionLabel.texture.needsUpdate = true;
      }

      let motion = "dance";
      let orbit = { x: 0, y: 0 };
      let drag = null;
      let zoom = 13.8;
      let recording = false;
      let recordingStartedAt = 0;
      let recordingTimer = 0;
      let stream = null;
      let exportCanvas = null;
      let exportContext = null;
      let recordingFailed = false;
      let activeRecorder = null;

      function chooseMotion(value) {
        if (!["walk", "dance", "play"].includes(value)) return;
        motion = value;
        buttons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.motion === value));
        });
        updateMotionLabel(value);
        if (!recording) {
          status.textContent = `${value[0].toUpperCase()}${value.slice(1)} animation · rendered in 3D`;
        }
      }

      buttons.forEach((button) => {
        button.addEventListener("click", () => chooseMotion(button.dataset.motion));
      });

      renderer.domElement.addEventListener("pointerdown", (event) => {
        drag = { x: event.clientX, y: event.clientY };
        renderer.domElement.setPointerCapture(event.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!drag) return;
        orbit.y += (event.clientX - drag.x) * 0.006;
        orbit.x = THREE.MathUtils.clamp(orbit.x + (event.clientY - drag.y) * 0.004, -0.32, 0.42);
        drag = { x: event.clientX, y: event.clientY };
      });
      renderer.domElement.addEventListener("pointerup", () => { drag = null; });
      renderer.domElement.addEventListener("pointercancel", () => { drag = null; });
      renderer.domElement.addEventListener("wheel", (event) => {
        zoom = THREE.MathUtils.clamp(zoom + event.deltaY * 0.012, 9.5, 19);
      }, { passive: true });

      function blink(time, offset) {
        const phase = ((time + offset) % 4.6) / 4.6;
        return phase > 0.94 ? Math.sin(((phase - 0.94) / 0.06) * Math.PI) : 0;
      }

      function animateCharacter(character, time, phase, index) {
        const { rig, head, legs = [], arms = [], wings = [], tailPivot } = character.userData;
        const base = motion === "walk" ? time * 5.2 : motion === "dance" ? time * 4.4 : time * 6.1;
        const swing = Math.sin(base + phase);
        const lift = Math.abs(Math.sin(base + phase));

        rig.position.y = lift * (motion === "walk" ? 0.07 : motion === "dance" ? 0.24 : 0.31);
        rig.rotation.y = Math.sin(time * 1.25 + phase) * (motion === "play" ? 0.27 : 0.09);
        rig.rotation.z = motion === "walk"
          ? swing * 0.045
          : Math.sin(base * 0.5 + phase) * (motion === "dance" ? 0.12 : 0.08);
        rig.scale.y = 1 - lift * (motion === "walk" ? 0.025 : 0.055);
        rig.scale.x = 1 + lift * (motion === "walk" ? 0.018 : 0.04);
        character.position.x = (index === 0 ? -1.55 : 1.55)
          + Math.sin(time * 0.7 + phase) * (motion === "play" ? 0.23 : 0.08);
        character.rotation.y = Math.sin(time * 0.55 + phase) * 0.08;
        head.rotation.z = Math.sin(time * 2.1 + phase) * 0.055;

        legs.forEach((leg, legIndex) => {
          leg.rotation.x = Math.sin(base + phase + legIndex * Math.PI) * (motion === "walk" ? 0.58 : 0.32);
          leg.rotation.z = motion === "dance"
            ? Math.sin(base * 0.5 + phase + legIndex) * 0.18
            : 0;
        });
        arms.forEach((arm, armIndex) => {
          arm.rotation.x = Math.sin(base + phase + armIndex * Math.PI) * (motion === "walk" ? 0.4 : 0.55);
          arm.rotation.z = (armIndex ? -1 : 1) * (0.12 + Math.sin(base + phase) * 0.22);
        });
        wings.forEach((wing, wingIndex) => {
          wing.rotation.z = (wingIndex ? -1 : 1) * (0.08 + lift * 0.5);
        });
        if (tailPivot) {
          tailPivot.rotation.x = Math.sin(time * 5 + phase) * 0.27;
          tailPivot.rotation.y = Math.sin(time * 3.8 + phase) * 0.4;
          tailPivot.rotation.z = Math.sin(time * 4 + phase) * (motion === "play" ? 0.48 : 0.28);
        }
        const amount = blink(time, phase);
        head.scale.y = 1 - amount * 0.08;
      }

      function resize() {
        if (recording) return;
        const width = innerWidth;
        const height = innerHeight;
        camera.aspect = width / height;
        camera.position.z = width < 600 ? zoom + 2.3 : zoom;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
        composer.setSize(width, height);
      }
      addEventListener("resize", resize);
      resize();

      function supportedRecordingTypes() {
        if (!window.MediaRecorder) return [];
        const preferredTypes = [
          "video/mp4;codecs=avc1.42E01E",
          "video/mp4",
          "video/webm;codecs=vp9",
          "video/webm;codecs=vp8",
          "video/webm",
        ];
        return preferredTypes.filter((type) => MediaRecorder.isTypeSupported(type));
      }

      function restorePreviewSize(width, height, pixelRatio) {
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(width, height, false);
        composer.setSize(width, height);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function finishRecording(chunks, mimeType, failed = false) {
        window.clearTimeout(recordingTimer);
        recordingTimer = 0;
        recording = false;
        activeRecorder = null;
        recordButton.disabled = false;
        recordButton.textContent = "Export 1080p video";
        buttons.forEach((button) => { button.disabled = false; });

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        exportCanvas = null;
        exportContext = null;

        const width = innerWidth;
        const height = innerHeight;
        restorePreviewSize(width, height, Math.min(devicePixelRatio, 1.75));

        if (failed || chunks.length === 0) {
          status.textContent = "Recording failed. Check browser support and try again.";
          return;
        }

        const blob = new Blob(chunks, { type: mimeType });
        const extension = mimeType.includes("mp4") ? "mp4" : "webm";
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `foxy-and-pip-${motion}-${EXPORT_WIDTH}x${EXPORT_HEIGHT}.${extension}`;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 60_000);
        status.textContent = `Video saved as ${extension.toUpperCase()} · 720p render upscaled to ${EXPORT_WIDTH}×${EXPORT_HEIGHT} · ${EXPORT_FPS} fps`;
      }

      function startRecording() {
        const supportedTypes = supportedRecordingTypes();
        if (!HTMLCanvasElement.prototype.captureStream || supportedTypes.length === 0) {
          status.textContent = "Video export is not supported in this browser. Try a current desktop Chrome or Edge.";
          return;
        }

        const maxTextureSize = renderer.capabilities.maxTextureSize;
        if (maxTextureSize < EXPORT_RENDER_WIDTH || maxTextureSize < EXPORT_RENDER_HEIGHT) {
          status.textContent = `This device cannot render ${EXPORT_RENDER_WIDTH}×${EXPORT_RENDER_HEIGHT}.`;
          return;
        }

        const previousSize = { width: innerWidth, height: innerHeight };
        try {
          recording = true;
          recordButton.disabled = true;
          recordButton.textContent = "Preparing video…";
          buttons.forEach((button) => { button.disabled = true; });
          renderer.setPixelRatio(1);
          renderer.setSize(EXPORT_RENDER_WIDTH, EXPORT_RENDER_HEIGHT, false);
          camera.aspect = EXPORT_RENDER_WIDTH / EXPORT_RENDER_HEIGHT;
          camera.updateProjectionMatrix();

          exportCanvas = document.createElement("canvas");
          exportCanvas.width = EXPORT_WIDTH;
          exportCanvas.height = EXPORT_HEIGHT;
          exportContext = exportCanvas.getContext("2d", { alpha: false });
          if (!exportContext) throw new Error("Could not create the video export canvas.");
          exportContext.imageSmoothingEnabled = true;
          exportContext.imageSmoothingQuality = "high";
          stream = exportCanvas.captureStream(EXPORT_FPS);
          if (stream.getVideoTracks().length === 0) {
            throw new Error("The browser did not provide a canvas video track.");
          }

          const chunks = [];
          let recorder = null;
          let mimeType = "";
          const initializationErrors = [];
          for (const candidate of supportedTypes) {
            try {
              recorder = new MediaRecorder(stream, {
                mimeType: candidate,
                videoBitsPerSecond: 14_000_000,
              });
              mimeType = candidate;
              break;
            } catch (error) {
              initializationErrors.push(`${candidate}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }
          if (!recorder) {
            throw new Error(`Could not initialize a supported video format. ${initializationErrors.join("; ")}`);
          }
          activeRecorder = recorder;
          recorder.addEventListener("dataavailable", (event) => {
            if (event.data.size > 0) chunks.push(event.data);
          });
          recordingFailed = false;
          recorder.addEventListener("error", () => {
            recordingFailed = true;
            status.textContent = "The browser encountered an error while recording.";
            if (recorder.state !== "inactive") recorder.stop();
          });
          let recordingHasStarted = false;
          function beginCapture() {
            if (recordingHasStarted || !recording) return;
            recordingHasStarted = true;
            recordingStartedAt = performance.now();
            recordButton.textContent = "Recording 12 seconds…";
            status.textContent = `Recording ${motion} · 720p render → 1080p video · ${EXPORT_FPS} fps`;
            recordingTimer = window.setTimeout(() => {
              if (recorder.state === "recording") recorder.stop();
            }, EXPORT_DURATION * 1000);
          }
          recorder.addEventListener("start", beginCapture, { once: true });
          recorder.addEventListener("stop", () => {
            finishRecording(chunks, recorder.mimeType || mimeType, recordingFailed);
          }, { once: true });
          recordingStartedAt = performance.now();
          recorder.start(1000);
          beginCapture();
        } catch (error) {
          console.error("Could not start video export:", error);
          recording = false;
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
            stream = null;
          }
          activeRecorder = null;
          exportCanvas = null;
          exportContext = null;
          recordButton.disabled = false;
          recordButton.textContent = "Export 1080p video";
          buttons.forEach((button) => { button.disabled = false; });
          restorePreviewSize(previousSize.width, previousSize.height, Math.min(devicePixelRatio, 1.75));
          status.textContent = error instanceof Error
            ? `Could not start recording: ${error.message}`
            : "Could not start video recording.";
        }
      }
      recordButton.addEventListener("click", startRecording);
      renderer.domElement.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        if (!recording) {
          recordButton.disabled = true;
          status.textContent = "The graphics device stopped. Reload the page to restart the 3D scene.";
          return;
        }
        recordingFailed = true;
        status.textContent = "The graphics device ran out of resources. The video was not saved.";
        if (activeRecorder && activeRecorder.state !== "inactive") activeRecorder.stop();
      });

      const clock = new THREE.Clock();
      function frame() {
        requestAnimationFrame(frame);
        const time = recording ? (performance.now() - recordingStartedAt) / 1000 : clock.getElapsedTime();
        animateCharacter(fox, time, 0, 0);
        animateCharacter(pip, time, Math.PI, 1);
        camera.position.x = Math.sin(orbit.y) * zoom;
        camera.position.z = Math.cos(orbit.y) * (innerWidth < 600 ? zoom + 2.3 : zoom);
        camera.position.y = 5.2 + orbit.x * 6;
        camera.lookAt(0, 2.05, 0);
        if (recording && exportContext) {
          renderer.render(scene, camera);
          exportContext.drawImage(renderer.domElement, 0, 0, EXPORT_WIDTH, EXPORT_HEIGHT);
        } else {
          composer.render();
        }
      }
      chooseMotion(motion);
      frame();
    </script>
  </body>
</html>
